server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Cache static assets
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PROXY TO RENDER BACKEND / API GATEWAY
    location /api/ {
        # DNS Resolver (prevents Nginx from caching stale Render IPs)
        resolver 1.1.1.1 8.8.8.8 valid=10s ipv6=off;
        set $backend_host "task-master-gateway.onrender.com";

        proxy_pass https://$backend_host;

        # Keep-Alive & Connection Reuse (CRITICAL FOR SPEED WITH VARIABLES)
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSL SNI Configuration
        proxy_ssl_server_name on;
        proxy_ssl_name task-master-gateway.onrender.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # Override Host Header
        proxy_set_header Host task-master-gateway.onrender.com;

        # Fast Retries and Timeouts
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Seamless failover if Render drops a connection
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;

        # Standard Proxy Headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward JWT Cookies
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}