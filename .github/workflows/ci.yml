name: CI/CD

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            path: taskmaster-backend/task-master-core
          - name: comment
            path: taskmaster-backend/task-master-comment
          - name: reports
            path: taskmaster-backend/task-master-reports
          - name: gateway
            path: taskmaster-backend/task-master-gateway
          - name: scheduler
            path: taskmaster-backend/task-master-scheduler
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Version Is Incremented
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TARGET_BRANCH="${{ github.base_ref }}"
            git fetch origin "$TARGET_BRANCH"
            COMPARE_REF="origin/$TARGET_BRANCH"
          else
            COMPARE_REF="HEAD~1"
          fi
          
          # Check if any files changed in this specific module directory
          CHANGED_FILES=$(git diff --name-only "$COMPARE_REF" HEAD -- ${{ matrix.path }})
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No changes detected in ${{ matrix.path }}. Skipping version check."
            exit 0
          fi
          
          echo "Changes detected in ${{ matrix.path }}. Verifying version bump against $COMPARE_REF..."
          
          # Strip out <parent>...</parent> block to get the actual project version
          CURRENT_VERSION=$(sed '/<parent>/,/<\/parent>/d' ${{ matrix.path }}/pom.xml | sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' | head -n 1 | xargs)
          BASE_VERSION=$(git show "$COMPARE_REF:${{ matrix.path }}/pom.xml" | sed '/<parent>/,/<\/parent>/d' | sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' | head -n 1 | xargs)
          
          echo "Base project version ($COMPARE_REF): $BASE_VERSION"
          echo "Current project version: $CURRENT_VERSION"
          
          if [ "$CURRENT_VERSION" == "$BASE_VERSION" ]; then
            echo "::error::Code changes were made in ${{ matrix.path }}, but its pom.xml version was not incremented!"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.path }}/pom.xml

      - name: Build and run tests
        working-directory: ${{ matrix.path }}
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x mvnw
            ./mvnw -B clean verify -DskipTests
          else
            mvn -B clean verify -DskipTests
          fi

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ matrix.path }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.name }}
          path: ${{ matrix.path }}/target/surefire-reports/*.xml
          if-no-files-found: ignore

  deploy:
    name: Trigger Render Deployments
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Core Service
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_CORE }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_CORE is empty!"
            exit 1
          fi
          curl -sS -X POST "$URL"

      - name: Deploy Comment Service
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_COMMENT }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_COMMENT is empty!"
            exit 1
          fi
          curl -sS -X POST "$URL"

      - name: Deploy Reports Service
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_REPORTS }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_REPORTS is empty!"
            exit 1
          fi
          curl -sS -X POST "$URL"

      - name: Deploy Gateway Service
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_GATEWAY }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_GATEWAY is empty!"
            exit 1
          fi
          curl -sS -X POST "$URL"

      - name: Deploy Scheduler Service
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_SCHEDULER }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_SCHEDULER is empty!"
            exit 1
          fi
          curl -sS -X POST "$URL"
