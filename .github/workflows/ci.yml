name: CI/CD

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            path: taskmaster-backend/task-master-core
          - name: comment
            path: taskmaster-backend/task-master-comment
          - name: reports
            path: taskmaster-backend/task-master-reports
          - name: gateway
            path: taskmaster-backend/task-master-gateway
          - name: scheduler
            path: taskmaster-backend/task-master-scheduler
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.path }}/pom.xml

      - name: Build and run tests
        working-directory: ${{ matrix.path }}
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x mvnw
            ./mvnw -B clean verify
          else
            mvn -B clean verify
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.name }}
          path: ${{ matrix.path }}/target/surefire-reports/*.xml
          if-no-files-found: ignore

  # No image-build/push job: Render builds each service directly from this repo's
  # own Dockerfiles per render.yaml (runtime: docker + dockerContext/dockerfilePath).
  # It never pulls from GHCR, so publishing images here would be dead work.
  #
  # Deploy gating: Render Blueprints auto-deploy on push to whatever branch each
  # service is connected to. To make sure only code that passed build-and-test
  # reaches Render, protect that branch in GitHub:
  #   Settings -> Branches -> Branch protection rule -> main (and staging if desired)
  #   -> Require status checks to pass before merging -> select "Build & Test (*)"
  # Once real JUnit tests exist and you want stricter control (e.g. block deploy
  # on push, not just on PR merge), disable Render's auto-deploy per service and
  # add a job here that calls each service's Render Deploy Hook URL after this
  # job succeeds.
