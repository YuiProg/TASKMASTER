name: CI/CD

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            path: taskmaster-backend/task-master-core
          - name: comment
            path: taskmaster-backend/task-master-comment
          - name: reports
            path: taskmaster-backend/task-master-reports
          - name: gateway
            path: taskmaster-backend/task-master-gateway
          - name: scheduler
            path: taskmaster-backend/task-master-scheduler
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.path }}/pom.xml

      - name: Build and run tests
        working-directory: ${{ matrix.path }}
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x mvnw
            ./mvnw -B clean verify -DskipTests
          else
            mvn -B clean verify -DskipTests
          fi

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ matrix.path }}'
          format: 'table'
          exit-code: '1' # Fails the step if matching vulnerabilities are found
          ignore-unfixed: true
          severity: 'CRITICAL' # Only fail on critical severity issues

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.name }}
          path: ${{ matrix.path }}/target/surefire-reports/*.xml
          if-no-files-found: ignore

  deploy:
    name: Trigger Render Deployments
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Core Service
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_CORE }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_CORE is empty!"
            exit 1
          fi
          curl -sS -X POST "$URL"

      - name: Deploy Comment Service
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_COMMENT }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_COMMENT is empty!"
            exit 1
          fi
          curl -sS -X POST "$URL"

      - name: Deploy Reports Service
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_REPORTS }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_REPORTS is empty!"
            exit 1
          fi
          curl -sS -X POST "$URL"

      - name: Deploy Gateway Service
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_GATEWAY }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_GATEWAY is empty!"
            exit 1
          fi
          curl -sS -X POST "$URL"

      - name: Deploy Scheduler Service
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_SCHEDULER }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_SCHEDULER is empty!"
            exit 1
          fi
          curl -sS -X POST "$URL"
