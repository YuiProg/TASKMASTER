          type: keyvalue
          name: task-master-redis
          property: port
      - key: REDIS_PASSWORD
        sync: false
      - key: SERVICES_BACKEND_URL
        fromService:
          type: web
          name: task-master-core
          property: hostport
      - key: SERVICES_COMMENT_URL
        fromService:
          type: web
          name: task-master-comment
          property: hostport
      - key: SERVICES_REPORT_URL
        fromService:
          type: web
          name: task-master-reports
          property: hostport

  # ── Comment service ──────────────────────────────────────────────────────
