services:
  # ── API Gateway — the only publicly reachable service ──────────────────
  - type: web
    name: task-master-gateway
    runtime: docker
    dockerContext: ./taskmaster-backend/task-master-gateway
    dockerfilePath: ./taskmaster-backend/task-master-gateway/Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "6543"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: EXPIRATION_TIME
        sync: false
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: task-master-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: task-master-redis
          property: port
      - key: REDIS_PASSWORD
        sync: false
      - key: SERVICES_BACKEND_URL
        fromService:
          type: web
          name: task-master-core
          property: hostport
      - key: SERVICES_COMMENT_URL
        fromService:
          type: web
          name: task-master-comment
          property: hostport
      - key: SERVICES_REPORT_URL
        fromService:
          type: web
          name: task-master-reports
          property: hostport

  # ── Core service (tasks, projects, users/auth) ──────────────────────────
  - type: web
    name: task-master-core
    runtime: docker
    dockerContext: ./taskmaster-backend/task-master-core
