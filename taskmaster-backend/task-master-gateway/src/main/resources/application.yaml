server:
  # Render automatically injects PORT (10000). Falling back to 8083 for local dev.
  port: ${PORT:8083}
  connection-timeout: 30000ms
  tomcat:
    connection-timeout: 30000ms
    keep-alive-timeout: 30000ms
    max-threads: 50
  compression:
    enabled: true
    mime-types: "application/json"

spring:
  application:
    name: task-master-gateway

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&channel_binding=require&prepareThreshold=0
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TaskMasterHikariPoolGateway
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      validation-timeout: 5000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      # Increased timeout to prevent Lettuce connection timeouts on cloud Redis
      timeout: 10000ms
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 10000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000

app:
  jwt:
    secret: ${SECRET_KEY}
    expiration: ${EXPIRATION_TIME}

services:
  backend:
    url: ${SERVICES_BACKEND_URL:http://localhost:8080/api/v1}
  comment:
    url: ${SERVICES_COMMENT_URL:http://localhost:8081/api/v1}
  report:
    url: ${SERVICES_REPORT_URL:http://localhost:8082/api/v1}

feign:
  client:
    config:
      default:
        connectTimeout: 20000
        readTimeout: 20000