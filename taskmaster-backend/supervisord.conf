[supervisord]
nodaemon=true

# 1. Core Service (Port 8080)
[program:core]
command=java -jar /app/task-master-core.jar --server.port=%(env(SERVER_PORT)s)
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# 2. Comment Service (Port 8081)
[program:comment]
command=java -jar /app/task-master-comment.jar --server.port=%(env(COMMENT_SERVER_PORT)s)
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# 3. Reports Service (Port 8082)
[program:reports]
command=java -jar /app/task-master-reports.jar --server.port=%(env(REPORT_SERVER_PORT)s)
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# 4. Gateway Service (Port 8083)
[program:gateway]
command=java -jar /app/task-master-gateway.jar --server.port=8083 --SERVICES_BACKEND_URL=%(env(SERVICES_BACKEND_URL)s) --SERVICES_COMMENT_URL=%(env(SERVICES_COMMENT_URL)s) --SERVICES_REPORT_URL=%(env(SERVICES_REPORT_URL)s)
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0