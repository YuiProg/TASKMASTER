[supervisord]
nodaemon=true
user=root

# Priority 1: Core starts first
[program:core]
command=java -Xms32m -Xmx96m -Xss256k -jar /app/task-master-core.jar --server.port=8080
priority=1
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Priority 2: Comment starts after Core
[program:comment]
command=java -Xms16m -Xmx64m -Xss256k -jar /app/task-master-comment.jar --server.port=8081
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Priority 3: Reports starts after Comment
[program:reports]
command=java -Xms16m -Xmx64m -Xss256k -jar /app/task-master-reports.jar --server.port=8082
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Priority 4: Gateway starts last so it can bind port 8083 immediately
[program:gateway]
command=java -Xms32m -Xmx80m -Xss256k -jar /app/task-master-gateway.jar --server.port=8083
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0