[supervisord]
nodaemon=true

# 1. Core Service
[program:core]
command=java -jar /app/task-master-core.jar --server.port=8080
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# 2. Comment Service
[program:comment]
command=java -jar /app/task-master-comment.jar --server.port=8081
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# 3. Reports Service
[program:reports]
command=java -jar /app/task-master-reports.jar --server.port=8082
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# 4. Gateway Service (Points internally to localhost)
[program:gateway]
command=java -jar /app/task-master-gateway.jar --server.port=8083 --SERVICES_BACKEND_URL=http://localhost:8080/api/v1
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0