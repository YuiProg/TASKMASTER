server:
  port: ${COMMENT_SERVER_PORT:8082} # Running on 8081 prevents port conflicts

spring:
  application:
    name: task-master-reports

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&channel_binding=require&prepareThreshold=0
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    Hikari:
      pool-name: TaskMasterHikariPoolReports
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      validation-timeout: 5000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${SECRET_KEY}
    expiration: ${EXPIRATION_TIME}